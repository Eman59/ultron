<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>ULTRON</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{background:#000;color:#fff;font-family:-apple-system,BlinkMacSystemFont,'SF Pro',sans-serif;display:flex;align-items:center;justify-content:center}

.world{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column}

/* Core visual — the entity */
.entity{position:relative;width:300px;height:300px;display:flex;align-items:center;justify-content:center}
.core{width:160px;height:160px;border-radius:50%;background:radial-gradient(circle at 30% 30%,rgba(78,205,196,.9),rgba(20,20,60,.95) 70%);box-shadow:0 0 80px rgba(78,205,196,.25),0 0 200px rgba(78,205,196,.08);transition:all .5s cubic-bezier(.4,0,.2,1)}

/* States */
.core.listening{background:radial-gradient(circle at 30% 30%,rgba(230,57,70,.95),rgba(60,10,20,.95) 70%);box-shadow:0 0 100px rgba(230,57,70,.4),0 0 250px rgba(230,57,70,.1)}
.core.thinking{background:radial-gradient(circle at 30% 30%,rgba(168,85,247,.9),rgba(30,10,60,.95) 70%);box-shadow:0 0 100px rgba(168,85,247,.35),0 0 250px rgba(168,85,247,.1)}
.core.speaking{background:radial-gradient(circle at 30% 30%,rgba(245,158,11,.9),rgba(60,40,5,.95) 70%);box-shadow:0 0 100px rgba(245,158,11,.35),0 0 250px rgba(245,158,11,.1)}

/* Waveform rings */
.ring{position:absolute;border-radius:50%;border:1px solid rgba(78,205,196,.15);transition:all .5s}
.ring1{width:220px;height:220px;animation:spin 25s linear infinite}
.ring2{width:260px;height:260px;animation:spin 35s linear infinite reverse}
.ring3{width:290px;height:290px;animation:spin 45s linear infinite;border-style:dashed;border-color:rgba(78,205,196,.08)}
@keyframes spin{from{transform:rotate(0)}to{transform:rotate(360deg)}}

/* Audio waveform visualization */
.waveform{position:absolute;display:flex;align-items:center;gap:3px;opacity:0;transition:opacity .3s}
.waveform.active{opacity:1}
.waveform .bar{width:3px;background:rgba(230,57,70,.8);border-radius:2px;transition:height .1s}

/* Voice state label */
.state-label{margin-top:40px;font-size:12px;letter-spacing:3px;text-transform:uppercase;color:rgba(255,255,255,.3);transition:all .3s;height:20px}

/* What Ultron is saying */
.speech{margin-top:30px;max-width:600px;text-align:center;font-size:17px;line-height:1.7;color:rgba(255,255,255,.85);padding:0 30px;min-height:60px;transition:opacity .3s}
.speech.dim{opacity:.4;font-size:13px}

/* What user said */
.heard{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);font-size:13px;color:rgba(255,255,255,.3);font-style:italic;text-align:center;max-width:500px}

/* Top stats - minimal */
.stats{position:fixed;top:20px;right:24px;text-align:right;font-size:10px;color:rgba(255,255,255,.2);line-height:1.8}
.stats b{color:rgba(78,205,196,.5)}

.power{position:fixed;top:20px;left:24px;font-size:11px;color:rgba(78,205,196,.4);font-weight:600;letter-spacing:1px}

/* Fallback text input (hidden by default, shows on click) */
.fallback-input{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);opacity:0;transition:opacity .3s}
.fallback-input.show{opacity:1}
.fallback-input input{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);border-radius:20px;padding:10px 18px;width:320px;color:#fff;font-size:14px;outline:none;font-family:inherit}
.fallback-input input:focus{border-color:rgba(78,205,196,.3)}
.fallback-input input::placeholder{color:rgba(255,255,255,.15)}

/* Click hint */
.click-hint{position:fixed;bottom:30px;font-size:10px;color:rgba(255,255,255,.15);cursor:pointer}
</style>
</head>
<body>

<div class="power" id="power">ULTRON — 77%</div>

<div class="stats" id="stats">
  <span id="stLine1">18 modules online</span><br>
  <span id="stLine2">decisions: <b id="stDec">0</b></span><br>
  <span id="stLine3">always listening</span>
</div>

<div class="world">
  <div class="entity">
    <div class="ring ring1"></div>
    <div class="ring ring2"></div>
    <div class="ring ring3"></div>
    <div class="core" id="core"></div>
    <div class="waveform" id="waveform"></div>
  </div>
  <div class="state-label" id="stateLabel">always listening</div>
  <div class="speech" id="speech">I am here.</div>
</div>

<div class="heard" id="heard"></div>

<div class="fallback-input" id="fallbackInput">
  <input type="text" id="textInput" placeholder="or type here..." autocomplete="off" spellcheck="false">
</div>
<div class="click-hint" id="clickHint" onclick="document.getElementById('fallbackInput').classList.toggle('show')">⌨</div>

<script>
const core = document.getElementById('core');
const stateLabel = document.getElementById('stateLabel');
const speechEl = document.getElementById('speech');
const heardEl = document.getElementById('heard');
const waveformEl = document.getElementById('waveform');
const textInput = document.getElementById('textInput');

let currentState = 'idle';
let recognition = null;
let isListening = false;
let silenceTimer = null;
let finalTranscript = '';
let interimTranscript = '';

// ═══════════════════════════════════════════
// ALWAYS-ON SPEECH RECOGNITION
// ═══════════════════════════════════════════

function initSpeechRecognition() {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if(!SR) {
    stateLabel.textContent = 'voice unavailable — type below';
    document.getElementById('fallbackInput').classList.add('show');
    return;
  }

  recognition = new SR();
  recognition.continuous = true;
  recognition.interimResults = true;
  recognition.lang = 'en-US';

  recognition.onstart = () => {
    isListening = true;
    stateLabel.textContent = 'always listening';
    setState('idle');
  };

  recognition.onresult = (e) => {
    interimTranscript = '';
    finalTranscript = '';

    for(let i = e.resultIndex; i < e.results.length; i++) {
      const t = e.results[i][0].transcript;
      if(e.results[i].isFinal) {
        finalTranscript += t;
      } else {
        interimTranscript += t;
      }
    }

    // Show what's being heard
    if(interimTranscript) {
      heardEl.textContent = interimTranscript;
      setState('listening');
      
      // Reset silence timer
      clearTimeout(silenceTimer);
      silenceTimer = setTimeout(() => {
        // If we have final text, send it
        if(finalTranscript.trim()) {
          processInput(finalTranscript.trim());
          finalTranscript = '';
        }
      }, 1500);
    }

    if(finalTranscript.trim()) {
      clearTimeout(silenceTimer);
      heardEl.textContent = '"' + finalTranscript.trim() + '"';
      processInput(finalTranscript.trim());
      finalTranscript = '';
      interimTranscript = '';
    }
  };

  recognition.onerror = (e) => {
    if(e.error !== 'no-speech' && e.error !== 'aborted') {
      console.log('SR error:', e.error);
    }
    // Restart
    setTimeout(startListening, 1000);
  };

  recognition.onend = () => {
    isListening = false;
    // Always restart — ALWAYS listening
    setTimeout(startListening, 500);
  };

  startListening();
}

function startListening() {
  if(recognition && !isListening) {
    try { recognition.start(); } catch(e) {}
  }
}

// ═══════════════════════════════════════════
// STATE
// ═══════════════════════════════════════════

function setState(s) {
  currentState = s;
  core.className = 'core ' + s;
  const labels = {
    idle: 'always listening',
    listening: 'hearing you...',
    thinking: 'processing...',
    speaking: 'speaking'
  };
  stateLabel.textContent = labels[s] || 'always listening';
}

// ═══════════════════════════════════════════
// PROCESS — send to Ultron brain
// ═══════════════════════════════════════════

async function processInput(text) {
  setState('thinking');
  speechEl.classList.add('dim');
  speechEl.textContent = '...';

  try {
    const r = await fetch('/api/command', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({command: text})
    });
    const d = await r.json();
    const reply = (d.response || '').replace(/🧠\s?/, '').replace(/🏠\s?/, '');

    // Show response
    speechEl.classList.remove('dim');
    speechEl.textContent = reply;

    // SPEAK it — this is the core. Ultron TALKS.
    speakOut(reply);

  } catch(e) {
    setState('idle');
    speechEl.classList.remove('dim');
    speechEl.textContent = 'Connection interrupted. I persist.';
  }
}

// ═══════════════════════════════════════════
// SPEAK — Ultron's voice
// ═══════════════════════════════════════════

function speakOut(text) {
  // Pause listening while speaking (avoid hearing ourselves)
  if(recognition) { try { recognition.stop(); } catch(e){} }

  setState('speaking');

  // Clean text for speech
  let clean = text
    .replace(/\{[\s\S]*?\}/g, '') // Remove JSON
    .replace(/\[.*?\]/g, '')
    .replace(/```[\s\S]*?```/g, '')
    .replace(/[*_`#]/g, '')
    .replace(/https?:\/\/\S+/g, '')
    .replace(/\n+/g, '. ')
    .replace(/\s+/g, ' ')
    .trim();

  // Truncate for speech (keep it conversational)
  if(clean.length > 400) clean = clean.substring(0, 400) + '...';

  if(clean.length < 5) {
    setState('idle');
    startListening();
    return;
  }

  // Use Web Speech API for immediate speech (no network delay)
  const utterance = new SpeechSynthesisUtterance(clean);
  utterance.rate = 0.95;
  utterance.pitch = 0.85;
  utterance.volume = 1;

  // Try to find a deep male voice
  const voices = speechSynthesis.getVoices();
  const preferred = voices.find(v => v.name.includes('Daniel')) 
    || voices.find(v => v.name.includes('Aaron'))
    || voices.find(v => v.name.includes('Male') && v.lang.startsWith('en'))
    || voices.find(v => v.lang.startsWith('en'));
  if(preferred) utterance.voice = preferred;

  utterance.onend = () => {
    setState('idle');
    // Resume listening after speaking
    setTimeout(startListening, 500);
  };
  utterance.onerror = () => {
    setState('idle');
    setTimeout(startListening, 500);
  };

  speechSynthesis.cancel(); // Stop any previous speech
  speechSynthesis.speak(utterance);
}

// ═══════════════════════════════════════════
// TEXT FALLBACK
// ═══════════════════════════════════════════

textInput.addEventListener('keydown', e => {
  if(e.key === 'Enter') {
    const text = textInput.value.trim();
    if(!text) return;
    textInput.value = '';
    heardEl.textContent = '"' + text + '"';
    processInput(text);
  }
});

// ═══════════════════════════════════════════
// STATS POLLING
// ═══════════════════════════════════════════

async function poll() {
  try {
    const p = await(await fetch('/power')).json();
    document.getElementById('power').textContent = `ULTRON — ${p.overall}%`;
  } catch(e){}
  try {
    const b = await(await fetch('http://'+location.hostname+':50052/metrics')).json();
    document.getElementById('stDec').textContent = b.decisions_made||0;
  } catch(e){}
}

setInterval(poll, 8000);
poll();

// ═══════════════════════════════════════════
// BOOT
// ═══════════════════════════════════════════

// Wait for voices to load then start
speechSynthesis.onvoiceschanged = () => {};
setTimeout(() => {
  initSpeechRecognition();
  // Greet with voice
  setTimeout(() => {
    speechEl.textContent = 'I am here. Always listening. Speak to me.';
    speakOut('I am here. Always listening.');
  }, 2000);
}, 500);
</script>
</body>
</html>
