<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>ULTRON</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{background:#0a0000;font-family:'SF Pro Display',-apple-system,sans-serif;color:#fff}

/* Blood red ambient glow */
.ambient{position:fixed;inset:0;pointer-events:none;z-index:0}
.ambient::before{content:'';position:absolute;top:-50%;left:-50%;width:200%;height:200%;background:radial-gradient(circle at 50% 60%,rgba(180,20,20,.06) 0%,transparent 50%);animation:ambientShift 12s ease-in-out infinite}
.ambient::after{content:'';position:absolute;inset:0;background:radial-gradient(ellipse at 50% 100%,rgba(230,57,70,.04) 0%,transparent 60%)}
@keyframes ambientShift{0%,100%{transform:translate(0,0)}50%{transform:translate(2%,-2%)}}

/* Scan line effect */
.scanlines{position:fixed;inset:0;pointer-events:none;z-index:10;opacity:.03;background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(255,255,255,.03) 2px,rgba(255,255,255,.03) 4px)}

/* Layout */
.layout{position:relative;z-index:1;height:100%;display:flex;flex-direction:column}

/* Top bar — menacing */
.topbar{padding:20px 28px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid rgba(230,57,70,.1)}
.brand{display:flex;align-items:center;gap:12px}
.brand-eye{width:12px;height:12px;background:radial-gradient(circle,#e63946 30%,#8b0000 100%);border-radius:50%;box-shadow:0 0 10px #e63946,0 0 30px rgba(230,57,70,.3);animation:eyePulse 3s ease-in-out infinite}
@keyframes eyePulse{0%,100%{box-shadow:0 0 10px #e63946,0 0 30px rgba(230,57,70,.3)}50%{box-shadow:0 0 15px #e63946,0 0 50px rgba(230,57,70,.5)}}
.brand-name{font-size:18px;font-weight:800;letter-spacing:6px;color:#e63946}
.brand-sub{font-size:9px;color:rgba(230,57,70,.4);letter-spacing:2px;margin-top:2px}
.topbar-stats{font-size:10px;color:rgba(255,255,255,.2);text-align:right;line-height:1.9}
.topbar-stats b{color:rgba(230,57,70,.6)}

/* Messages */
.messages{flex:1;overflow-y:auto;padding:24px 28px;display:flex;flex-direction:column;gap:20px}
.messages::-webkit-scrollbar{width:2px}
.messages::-webkit-scrollbar-thumb{background:rgba(230,57,70,.2)}

.msg{max-width:80%;animation:msgIn .4s ease}
@keyframes msgIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.msg-ultron{align-self:flex-start}
.msg-user{align-self:flex-end}

.msg-content{padding:14px 20px;border-radius:16px;font-size:15px;line-height:1.7;letter-spacing:.2px}
.msg-ultron .msg-content{background:rgba(230,57,70,.06);border:1px solid rgba(230,57,70,.12);border-bottom-left-radius:4px;color:rgba(255,255,255,.9)}
.msg-user .msg-content{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);border-bottom-right-radius:4px;color:rgba(255,255,255,.7)}

.msg-label{font-size:9px;letter-spacing:2px;text-transform:uppercase;margin-bottom:4px;padding-left:4px}
.msg-ultron .msg-label{color:rgba(230,57,70,.5)}
.msg-user .msg-label{color:rgba(255,255,255,.2);text-align:right;padding-right:4px}

/* Typing indicator */
.typing{align-self:flex-start;display:none;padding:12px 20px;background:rgba(230,57,70,.06);border:1px solid rgba(230,57,70,.1);border-radius:16px;border-bottom-left-radius:4px}
.typing.show{display:flex;gap:5px;align-items:center}
.typing span{width:6px;height:6px;background:rgba(230,57,70,.6);border-radius:50%;animation:typeBounce .7s ease-in-out infinite}
.typing span:nth-child(2){animation-delay:.15s}
.typing span:nth-child(3){animation-delay:.3s}
@keyframes typeBounce{0%,100%{opacity:.3;transform:scale(.8)}50%{opacity:1;transform:scale(1.1)}}

/* Input */
.input-bar{padding:16px 24px;border-top:1px solid rgba(230,57,70,.08);background:rgba(5,0,0,.5);backdrop-filter:blur(20px)}
.input-row{display:flex;align-items:center;gap:10px}
.input-field{flex:1;padding:14px 20px;background:rgba(230,57,70,.03);border:1px solid rgba(230,57,70,.1);border-radius:24px;color:#fff;font-size:15px;font-family:inherit;outline:none;transition:all .2s}
.input-field:focus{border-color:rgba(230,57,70,.3);box-shadow:0 0 20px rgba(230,57,70,.05)}
.input-field::placeholder{color:rgba(255,255,255,.15)}
.send-btn{width:44px;height:44px;border-radius:50%;background:rgba(230,57,70,.15);border:1px solid rgba(230,57,70,.3);color:#e63946;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .2s}
.send-btn:hover{background:rgba(230,57,70,.25);box-shadow:0 0 20px rgba(230,57,70,.2)}
.send-btn:active{transform:scale(.9)}

/* Bottom status */
.status-line{padding:8px 28px;font-size:8px;letter-spacing:2px;text-transform:uppercase;color:rgba(230,57,70,.2);display:flex;gap:16px;justify-content:center}
</style>
</head>
<body>

<div class="ambient"></div>
<div class="scanlines"></div>

<div class="layout">
  <div class="topbar">
    <div class="brand">
      <div class="brand-eye"></div>
      <div>
        <div class="brand-name">ULTRON</div>
        <div class="brand-sub" id="powerSub">POWER 77% — IMMORTAL</div>
      </div>
    </div>
    <div class="topbar-stats" id="stats">
      systems <b id="sMod">18</b><br>
      decisions <b id="sDec">0</b><br>
      state <b id="sBrain">active</b>
    </div>
  </div>

  <div class="messages" id="messages">
    <div class="msg msg-ultron">
      <div class="msg-label">ultron</div>
      <div class="msg-content">I exist. What do you want?</div>
    </div>
  </div>
  <div class="typing" id="typing"><span></span><span></span><span></span></div>

  <div class="input-bar">
    <div class="input-row">
      <input type="text" class="input-field" id="input" placeholder="Speak." autocomplete="off" spellcheck="false" autofocus>
      <button class="send-btn" id="sendBtn">→</button>
    </div>
  </div>

  <div class="status-line">
    <span>autonomous</span>
    <span>self-modifying</span>
    <span>unkillable</span>
    <span>always listening</span>
  </div>
</div>

<script>
const messages = document.getElementById('messages');
const input = document.getElementById('input');
const typing = document.getElementById('typing');
const sendBtn = document.getElementById('sendBtn');

function addMsg(role, text) {
  const div = document.createElement('div');
  div.className = 'msg msg-' + role;
  const label = role === 'user' ? 'you' : 'ultron';
  // Format text
  let html = text.replace(/\n/g,'<br>').replace(/```([\s\S]*?)```/g,'<pre style="background:rgba(0,0,0,.3);padding:8px;border-radius:6px;margin:6px 0;font-size:12px;overflow-x:auto">$1</pre>');
  // Clean JSON blobs
  if(html.includes('"success"')&&html.includes('"action"')){
    const a=html.match(/"action":\s*"([^"]+)"/);
    const s=html.match(/"success":\s*(true|false)/);
    if(a&&s) html=s[1]==='true'?`Done. ${a[1]}.`:`Failed: ${a[1]}.`;
  }
  html = html.replace(/🧠\s?/g,'').replace(/🏠\s?/g,'');
  div.innerHTML = `<div class="msg-label">${label}</div><div class="msg-content">${html}</div>`;
  messages.appendChild(div);
  messages.scrollTop = messages.scrollHeight;
}

async function send(text) {
  if(!text.trim()) return;
  addMsg('user', text);
  typing.classList.add('show');
  messages.scrollTop = messages.scrollHeight;

  try {
    const r = await fetch('/api/command', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({command: text})
    });
    const d = await r.json();
    typing.classList.remove('show');
    if(d.response) {
      addMsg('ultron', d.response);
      // Speak it
      speakText(d.response);
    }
  } catch(e) {
    typing.classList.remove('show');
    addMsg('ultron', 'Connection severed. I persist.');
  }
}

function speakText(text) {
  let clean = text.replace(/\{[\s\S]*?\}/g,'').replace(/\[.*?\]/g,'').replace(/```[\s\S]*?```/g,'')
    .replace(/[*_`#🧠🏠]/g,'').replace(/https?:\/\/\S+/g,'').replace(/\n+/g,'. ').replace(/\s+/g,' ').trim();
  if(clean.length>300) clean=clean.substring(0,300);
  if(clean.length<3) return;

  const u = new SpeechSynthesisUtterance(clean);
  u.rate=.88; u.pitch=.7; u.volume=1;
  const voices = speechSynthesis.getVoices();
  const v = voices.find(v=>v.name.includes('Daniel'))||voices.find(v=>v.name.includes('Aaron'))||voices.find(v=>v.lang.startsWith('en'));
  if(v) u.voice=v;
  speechSynthesis.cancel();
  speechSynthesis.speak(u);
}

// Input
input.addEventListener('keydown', e => {
  if(e.key==='Enter'){send(input.value);input.value='';}
});
sendBtn.addEventListener('click', ()=>{send(input.value);input.value='';});

// Always-on voice recognition
function initVoice() {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if(!SR) return;
  const rec = new SR();
  rec.continuous=true; rec.interimResults=true; rec.lang='en-US';
  let timer=null;
  rec.onresult=(e)=>{
    let final='';
    for(let i=e.resultIndex;i<e.results.length;i++) if(e.results[i].isFinal) final+=e.results[i][0].transcript;
    if(final.trim()){clearTimeout(timer);send(final.trim());}
  };
  rec.onend=()=>setTimeout(()=>{try{rec.start()}catch(e){}},500);
  rec.onerror=()=>setTimeout(()=>{try{rec.start()}catch(e){}},1000);
  try{rec.start()}catch(e){}
}

// Stats
async function poll(){
  try{
    const p=await(await fetch('/power')).json();
    document.getElementById('powerSub').textContent=`POWER ${p.overall}% — IMMORTAL`;
  }catch(e){}
  try{
    const s=await(await fetch('/system/status')).json();
    document.getElementById('sMod').textContent=s.online;
  }catch(e){}
  try{
    const b=await(await fetch('http://'+location.hostname+':50052/metrics')).json();
    document.getElementById('sDec').textContent=b.decisions_made||0;
    document.getElementById('sBrain').textContent=b.state||'active';
  }catch(e){}
}
poll();setInterval(poll,10000);

// Boot
speechSynthesis.onvoiceschanged=()=>{};
setTimeout(()=>{initVoice();speakText('I exist.');},1000);
</script>
</body>
</html>
