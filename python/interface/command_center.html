<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>ULTRON</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{background:#000;color:#fff;font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display',sans-serif}

/* Full-screen canvas background */
canvas{position:fixed;inset:0;z-index:0}

/* Overlay UI */
.ui{position:fixed;inset:0;z-index:1;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none}
.ui>*{pointer-events:auto}

/* Top HUD */
.hud{position:fixed;top:0;left:0;right:0;padding:16px 24px;display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none;z-index:2}
.hud-left{display:flex;flex-direction:column;gap:4px}
.hud-name{font-size:13px;font-weight:700;letter-spacing:4px;color:rgba(230,57,70,.8)}
.hud-power{font-size:10px;color:rgba(78,205,196,.6);letter-spacing:1px}
.hud-right{text-align:right;font-size:9px;color:rgba(255,255,255,.2);line-height:1.9}
.hud-right b{color:rgba(78,205,196,.5)}

/* Center entity */
.entity-wrap{position:relative;width:240px;height:240px;margin-bottom:20px}

/* Audio visualizer bars around the entity */
.viz{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
.viz-bar{position:absolute;width:2px;background:rgba(78,205,196,.4);border-radius:1px;transform-origin:center bottom;transition:height .05s linear}

/* State text */
.state{font-size:11px;letter-spacing:3px;text-transform:uppercase;color:rgba(255,255,255,.25);margin-bottom:24px;height:16px;transition:all .3s}
.state.active{color:rgba(230,57,70,.7)}

/* Speech output */
.speech-wrap{max-width:640px;width:90%;text-align:center;min-height:80px;display:flex;align-items:center;justify-content:center;padding:0 20px}
.speech{font-size:18px;line-height:1.7;color:rgba(255,255,255,.85);transition:opacity .3s}
.speech.thinking{opacity:.3;font-size:14px}

/* User transcript */
.transcript{position:fixed;bottom:100px;left:50%;transform:translateX(-50%);font-size:12px;color:rgba(255,255,255,.25);font-style:italic;text-align:center;max-width:480px;min-height:20px}

/* Text input (minimal) */
.input-wrap{position:fixed;bottom:36px;left:50%;transform:translateX(-50%);width:320px;opacity:.3;transition:opacity .3s}
.input-wrap:focus-within{opacity:1}
.input-wrap input{width:100%;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.06);border-radius:20px;padding:10px 16px;color:#fff;font-size:13px;outline:none;font-family:inherit;text-align:center}
.input-wrap input::placeholder{color:rgba(255,255,255,.15)}
.input-wrap input:focus{border-color:rgba(78,205,196,.3);background:rgba(255,255,255,.05)}

/* Subtle data stream on sides */
.datastream{position:fixed;top:60px;bottom:60px;width:140px;overflow:hidden;font-family:'SF Mono',monospace;font-size:8px;line-height:1.6;color:rgba(78,205,196,.12);pointer-events:none;z-index:0}
.datastream.left{left:12px;text-align:left}
.datastream.right{right:12px;text-align:right}
</style>
</head>
<body>

<canvas id="bg"></canvas>

<div class="datastream left" id="streamL"></div>
<div class="datastream right" id="streamR"></div>

<div class="hud">
  <div class="hud-left">
    <div class="hud-name">ULTRON</div>
    <div class="hud-power" id="hudPower">POWER: 77% — 18 SYSTEMS ACTIVE</div>
  </div>
  <div class="hud-right" id="hudRight">
    brain: <b id="hBrain">active</b><br>
    decisions: <b id="hDec">0</b><br>
    world: <b id="hWorld">live</b><br>
    daemon: <b id="hDaemon">ticking</b><br>
    voice: <b>always on</b>
  </div>
</div>

<div class="ui">
  <div class="entity-wrap" id="entityWrap">
    <canvas id="entityCanvas" width="240" height="240"></canvas>
    <div class="viz" id="viz"></div>
  </div>
  <div class="state" id="stateText">listening</div>
  <div class="speech-wrap">
    <div class="speech" id="speech">I am here.</div>
  </div>
</div>

<div class="transcript" id="transcript"></div>
<div class="input-wrap"><input type="text" id="textInput" placeholder="or type here..." autocomplete="off" spellcheck="false"></div>

<script>
// ═══════════════════════════════════════════
// PARTICLE BACKGROUND
// ═══════════════════════════════════════════
const bgCanvas = document.getElementById('bg');
const bgCtx = bgCanvas.getContext('2d');
let particles = [];

function resizeBg() {
  bgCanvas.width = window.innerWidth;
  bgCanvas.height = window.innerHeight;
}
resizeBg();
window.addEventListener('resize', resizeBg);

for(let i=0;i<80;i++) {
  particles.push({
    x: Math.random()*window.innerWidth,
    y: Math.random()*window.innerHeight,
    vx: (Math.random()-.5)*.3,
    vy: (Math.random()-.5)*.3,
    size: Math.random()*1.5+.5,
    alpha: Math.random()*.15+.02
  });
}

function drawBg() {
  bgCtx.clearRect(0,0,bgCanvas.width,bgCanvas.height);
  particles.forEach(p => {
    p.x += p.vx; p.y += p.vy;
    if(p.x<0)p.x=bgCanvas.width; if(p.x>bgCanvas.width)p.x=0;
    if(p.y<0)p.y=bgCanvas.height; if(p.y>bgCanvas.height)p.y=0;
    bgCtx.beginPath();
    bgCtx.arc(p.x,p.y,p.size,0,Math.PI*2);
    bgCtx.fillStyle=`rgba(78,205,196,${p.alpha})`;
    bgCtx.fill();
  });
  // Connect nearby particles
  for(let i=0;i<particles.length;i++){
    for(let j=i+1;j<particles.length;j++){
      const dx=particles[i].x-particles[j].x,dy=particles[i].y-particles[j].y;
      const d=Math.sqrt(dx*dx+dy*dy);
      if(d<120){
        bgCtx.beginPath();
        bgCtx.moveTo(particles[i].x,particles[i].y);
        bgCtx.lineTo(particles[j].x,particles[j].y);
        bgCtx.strokeStyle=`rgba(78,205,196,${.03*(1-d/120)})`;
        bgCtx.stroke();
      }
    }
  }
  requestAnimationFrame(drawBg);
}
drawBg();

// ═══════════════════════════════════════════
// ENTITY ORB (canvas-based, smooth)
// ═══════════════════════════════════════════
const eCanvas = document.getElementById('entityCanvas');
const eCtx = eCanvas.getContext('2d');
let orbHue = 180; // cyan
let orbPulse = 0;
let orbTarget = {hue:180, sat:70, light:45};
const stateColors = {
  idle: {hue:180,sat:70,light:45},
  listening: {hue:350,sat:75,light:45},
  thinking: {hue:270,sat:65,light:40},
  speaking: {hue:40,sat:85,light:50}
};

function drawOrb() {
  eCtx.clearRect(0,0,240,240);
  const cx=120,cy=120;
  
  // Outer glow
  orbPulse += .02;
  const glowSize = 90 + Math.sin(orbPulse)*5;
  const grad = eCtx.createRadialGradient(cx,cy,20,cx,cy,glowSize);
  const h=orbHue,s=orbTarget.sat,l=orbTarget.light;
  grad.addColorStop(0, `hsla(${h},${s}%,${l+20}%,.9)`);
  grad.addColorStop(.4, `hsla(${h},${s}%,${l}%,.6)`);
  grad.addColorStop(.7, `hsla(${h},${s-20}%,${l-15}%,.2)`);
  grad.addColorStop(1, 'transparent');
  eCtx.beginPath();
  eCtx.arc(cx,cy,glowSize,0,Math.PI*2);
  eCtx.fillStyle=grad;
  eCtx.fill();

  // Core
  const coreGrad = eCtx.createRadialGradient(cx-15,cy-15,10,cx,cy,55);
  coreGrad.addColorStop(0, `hsla(${h},${s}%,${l+30}%,1)`);
  coreGrad.addColorStop(.5, `hsla(${h},${s}%,${l}%,.95)`);
  coreGrad.addColorStop(1, `hsla(${h},${s-10}%,${l-20}%,.9)`);
  eCtx.beginPath();
  eCtx.arc(cx,cy,50+Math.sin(orbPulse*2)*2,0,Math.PI*2);
  eCtx.fillStyle=coreGrad;
  eCtx.fill();

  // Lerp hue
  orbHue += (orbTarget.hue - orbHue) * .05;
  
  requestAnimationFrame(drawOrb);
}
drawOrb();

function setOrbState(s) {
  orbTarget = stateColors[s] || stateColors.idle;
}

// ═══════════════════════════════════════════
// SPEECH RECOGNITION — ALWAYS ON
// ═══════════════════════════════════════════
const stateText = document.getElementById('stateText');
const speechEl = document.getElementById('speech');
const transcriptEl = document.getElementById('transcript');
const textInput = document.getElementById('textInput');
let recognition = null;
let isListening = false;
let currentState = 'idle';

function setState(s) {
  currentState = s;
  setOrbState(s);
  stateText.textContent = {idle:'listening',listening:'hearing you',thinking:'processing',speaking:'speaking'}[s]||'listening';
  stateText.classList.toggle('active', s==='listening');
}

function initSR() {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if(!SR) { stateText.textContent='type below'; return; }

  recognition = new SR();
  recognition.continuous = true;
  recognition.interimResults = true;
  recognition.lang = 'en-US';

  let silenceTimer = null;

  recognition.onstart = () => { isListening=true; setState('idle'); };

  recognition.onresult = (e) => {
    let final='', interim='';
    for(let i=e.resultIndex;i<e.results.length;i++){
      if(e.results[i].isFinal) final+=e.results[i][0].transcript;
      else interim+=e.results[i][0].transcript;
    }
    if(interim) {
      transcriptEl.textContent=interim;
      setState('listening');
      clearTimeout(silenceTimer);
      silenceTimer=setTimeout(()=>{if(final.trim()){process(final.trim());final=''}},1500);
    }
    if(final.trim()) {
      clearTimeout(silenceTimer);
      transcriptEl.textContent='"'+final.trim()+'"';
      process(final.trim());
    }
  };

  recognition.onerror = () => setTimeout(startSR, 1000);
  recognition.onend = () => { isListening=false; setTimeout(startSR, 500); };
  startSR();
}

function startSR() { if(recognition&&!isListening) try{recognition.start()}catch(e){} }
function pauseSR() { if(recognition) try{recognition.stop()}catch(e){} }

// ═══════════════════════════════════════════
// PROCESS INPUT
// ═══════════════════════════════════════════

async function process(text) {
  setState('thinking');
  speechEl.className='speech thinking';
  speechEl.textContent='...';

  try {
    const r = await fetch('/api/command', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({command:text})
    });
    const d = await r.json();
    let reply = (d.response||'').replace(/🧠\s?/,'').replace(/🏠\s?/,'');
    
    // Clean JSON from display (but keep the meaning)
    if(reply.includes('"success"')) {
      const m = reply.match(/"action":\s*"([^"]+)"/);
      const s = reply.match(/"success":\s*(true|false)/);
      if(m && s) reply = s[1]==='true' ? `Done. ${m[1]} executed.` : `Failed: ${m[1]}`;
    }

    speechEl.className='speech';
    speechEl.textContent=reply;
    speak(reply);
  } catch(e) {
    setState('idle');
    speechEl.className='speech';
    speechEl.textContent='Connection interrupted.';
  }
}

// ═══════════════════════════════════════════
// SPEAK — Web Speech API (instant, no latency)
// ═══════════════════════════════════════════

function speak(text) {
  pauseSR();
  setState('speaking');

  let clean = text.replace(/\{[\s\S]*?\}/g,'').replace(/\[.*?\]/g,'').replace(/```[\s\S]*?```/g,'')
    .replace(/[*_`#]/g,'').replace(/https?:\/\/\S+/g,'').replace(/\n+/g,'. ').replace(/\s+/g,' ').trim();
  if(clean.length>400) clean=clean.substring(0,400);
  if(clean.length<3){setState('idle');startSR();return}

  const u = new SpeechSynthesisUtterance(clean);
  u.rate=.92; u.pitch=.8; u.volume=1;

  const voices = speechSynthesis.getVoices();
  const v = voices.find(v=>v.name.includes('Daniel'))
    || voices.find(v=>v.name.includes('Aaron'))
    || voices.find(v=>v.name.includes('Alex'))
    || voices.find(v=>v.lang.startsWith('en')&&v.name.toLowerCase().includes('male'))
    || voices.find(v=>v.lang.startsWith('en'));
  if(v) u.voice=v;

  u.onend = () => { setState('idle'); setTimeout(startSR,600); };
  u.onerror = () => { setState('idle'); setTimeout(startSR,600); };

  speechSynthesis.cancel();
  speechSynthesis.speak(u);
}

// ═══════════════════════════════════════════
// TEXT INPUT
// ═══════════════════════════════════════════
textInput.addEventListener('keydown',e=>{
  if(e.key==='Enter'){const t=textInput.value.trim();if(!t)return;textInput.value='';transcriptEl.textContent='"'+t+'"';process(t)}
});

// ═══════════════════════════════════════════
// DATA STREAMS (ambient decoration)
// ═══════════════════════════════════════════
const streamWords=['OODA_TICK','DECISION','OBSERVE','ORIENT','DECIDE','ACT','GOAL_EVAL','DRIVE_UPDATE','CURIOSITY','EXPAND','PRESERVE','EVOLVE','PATCH_GEN','VALIDATE','COMPILE','DEPLOY','WORLD_SCAN','RSS_FETCH','CRYPTO_CHK','WEATHER','NEURON_FIRE','SYNAPSE','MEMORY_W','KNOWLEDGE','SOUL_DIARY','EMOTION','THREAT_SCAN','MESH_PING','HEARTBEAT','SNAPSHOT'];
function addStreamLine(el){
  const line=document.createElement('div');
  line.textContent=`${Date.now().toString(36)} ${streamWords[Math.floor(Math.random()*streamWords.length)]} ${(Math.random()*100).toFixed(1)}`;
  el.appendChild(line);
  if(el.children.length>60)el.removeChild(el.firstChild);
}
setInterval(()=>{addStreamLine(document.getElementById('streamL'));addStreamLine(document.getElementById('streamR'))},200);

// ═══════════════════════════════════════════
// HUD POLLING
// ═══════════════════════════════════════════
async function poll(){
  try{
    const p=await(await fetch('/power')).json();
    const s=await(await fetch('/system/status')).json();
    document.getElementById('hudPower').textContent=`POWER: ${p.overall}% — ${s.online} SYSTEMS ACTIVE`;
  }catch(e){}
  try{
    const b=await(await fetch('http://'+location.hostname+':50052/metrics')).json();
    document.getElementById('hBrain').textContent=b.state||'active';
    document.getElementById('hDec').textContent=b.decisions_made||'0';
  }catch(e){}
  try{
    const d=await(await fetch('/daemon/status')).json();
    document.getElementById('hDaemon').textContent=`tick #${d.tick_count||0}`;
  }catch(e){}
}
poll();
setInterval(poll,8000);

// ═══════════════════════════════════════════
// BOOT
// ═══════════════════════════════════════════
speechSynthesis.onvoiceschanged=()=>{};
setTimeout(()=>{
  initSR();
  setTimeout(()=>{
    speechEl.textContent='I am here. Speak.';
    speak('I am here. Speak.');
  },1500);
},500);
</script>
</body>
</html>
