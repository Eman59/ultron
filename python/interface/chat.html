<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ultron</title>
    <link rel="icon" type="image/png" href="/favicon.png">
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{background:#000;color:#fff;font-family:-apple-system,system-ui,sans-serif;height:100dvh;display:flex;flex-direction:column;overflow:hidden;-webkit-font-smoothing:antialiased}

        /* Header */
        header{padding:14px 20px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #1a1a1a}
        .logo{font-size:15px;font-weight:700;letter-spacing:4px;color:#e63946}
        .status{font-size:11px;color:#4ade80;display:flex;align-items:center;gap:6px}
        .status::before{content:'';width:6px;height:6px;border-radius:50%;background:#4ade80;box-shadow:0 0 4px #4ade80}

        /* Messages */
        #messages{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:12px;scrollbar-width:none}
        #messages::-webkit-scrollbar{display:none}

        .msg{max-width:85%;padding:10px 14px;border-radius:16px;font-size:14px;line-height:1.5;animation:fadeUp .3s ease}
        .msg.user{align-self:flex-end;background:#1a1a2e;border-radius:16px 16px 4px 16px}
        .msg.ai{align-self:flex-start;background:#111;border:1px solid #222;border-radius:16px 16px 16px 4px}
        @keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

        /* Thinking dots */
        .dots{display:flex;gap:4px;padding:10px 14px}
        .dots span{width:6px;height:6px;border-radius:50%;background:#555;animation:blink 1.4s infinite}
        .dots span:nth-child(2){animation-delay:.2s}
        .dots span:nth-child(3){animation-delay:.4s}
        @keyframes blink{0%,80%,100%{opacity:.3}40%{opacity:1}}

        /* Input area */
        #input-bar{padding:10px 12px;border-top:1px solid #1a1a1a;display:flex;gap:8px;align-items:center;background:#0a0a0a}
        #input-bar input{flex:1;background:#151515;border:1px solid #2a2a2a;color:#fff;padding:12px 16px;border-radius:22px;font-size:15px;outline:none;transition:border .2s}
        #input-bar input:focus{border-color:#e63946}
        .btn{width:42px;height:42px;border-radius:50%;border:none;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all .15s}
        #mic-btn{background:#1a1a1a;color:#999}
        #mic-btn.on{background:#e63946;color:#fff;animation:pulse 1.5s infinite}
        #send-btn{background:#e63946;color:#fff}
        #send-btn:active{transform:scale(.92)}
        @keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(230,57,70,.4)}50%{box-shadow:0 0 0 8px rgba(230,57,70,0)}}

        /* Speaking bar */
        #speak-bar{position:fixed;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,transparent,#4ecdc4,transparent);opacity:0;z-index:99}
        body.speaking #speak-bar{opacity:1;animation:slide 1.5s infinite linear}
        @keyframes slide{from{transform:translateX(-100%)}to{transform:translateX(100%)}}
    </style>
</head>
<body>
    <div id="speak-bar"></div>
    <header>
        <span class="logo">ULTRON</span>
        <span class="status" id="status-text">Online</span>
    </header>

    <div id="messages"></div>

    <div id="input-bar">
        <button class="btn" id="mic-btn" onclick="toggleMic()">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2a3 3 0 00-3 3v7a3 3 0 006 0V5a3 3 0 00-3-3z"/><path d="M19 10v2a7 7 0 01-14 0v-2"/><line x1="12" y1="19" x2="12" y2="22"/></svg>
        </button>
        <input id="input" type="text" placeholder="Message Ultron..." autocomplete="off">
        <button class="btn" id="send-btn" onclick="send()">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
        </button>
    </div>

    <script>
    const input = document.getElementById('input');
    const messages = document.getElementById('messages');
    const synthesis = window.speechSynthesis;
    let recognition, isListening = false, isSpeaking = false;

    // Send on Enter
    input.addEventListener('keydown', e => { if(e.key==='Enter'){e.preventDefault();send()} });

    function send() {
        const text = input.value.trim();
        if(!text) return;
        input.value = '';
        processInput(text);
    }

    // Mic
    function toggleMic() {
        if(isListening) { stopMic(); return; }
        const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
        if(!SR) { input.focus(); return; }
        if(!recognition) {
            recognition = new SR();
            recognition.continuous = false;
            recognition.interimResults = true;
            recognition.lang = 'en-US';
            recognition.onresult = e => {
                let final = '';
                for(let i=e.resultIndex;i<e.results.length;i++){
                    if(e.results[i].isFinal) final += e.results[i][0].transcript;
                    else input.value = e.results[i][0].transcript;
                }
                if(final){ input.value=''; stopMic(); processInput(final.trim()); }
            };
            recognition.onend = () => stopMic();
            recognition.onerror = () => stopMic();
        }
        isListening = true;
        document.getElementById('mic-btn').classList.add('on');
        input.placeholder = 'Listening...';
        try{recognition.start()}catch(e){}
    }

    function stopMic() {
        isListening = false;
        document.getElementById('mic-btn').classList.remove('on');
        input.placeholder = 'Message Ultron...';
        try{recognition.stop()}catch(e){}
    }

    // Process
    function processInput(text) {
        addMsg('user', text);
        showDots();
        synthesis.cancel();

        fetch('/decide', {
            method:'POST',
            headers:{'Content-Type':'application/json'},
            body:JSON.stringify({query:text, priority:'normal'})
        })
        .then(r=>r.json())
        .then(d=>{
            removeDots();
            const reply = d.reasoning || d.response || 'No response.';
            addMsg('ai', reply);
            speak(reply);
        })
        .catch(()=>{ removeDots(); addMsg('ai','Connection error.'); });
    }

    // Messages
    function addMsg(who, text) {
        const el = document.createElement('div');
        el.className = 'msg ' + who;
        el.textContent = text;
        messages.appendChild(el);
        messages.scrollTop = messages.scrollHeight;
        if(messages.children.length > 50) messages.removeChild(messages.firstChild);
    }
    function showDots() {
        const el = document.createElement('div');
        el.className='dots';el.id='thinking';
        el.innerHTML='<span></span><span></span><span></span>';
        messages.appendChild(el);
        messages.scrollTop = messages.scrollHeight;
    }
    function removeDots() { const d=document.getElementById('thinking');if(d)d.remove(); }

    // TTS
    function speak(text) {
        let clean = text.replace(/```[\s\S]*?```/g,'').replace(/`([^`]+)`/g,'$1').replace(/\*\*?([^*]+)\*\*?/g,'$1').trim();
        if(!clean) return;
        isSpeaking=true; document.body.classList.add('speaking');
        const parts = clean.match(/[^.!?]+[.!?]+/g)||[clean];
        let i=0;
        function next(){
            if(i>=parts.length||!isSpeaking){isSpeaking=false;document.body.classList.remove('speaking');return}
            const u=new SpeechSynthesisUtterance(parts[i].trim());
            u.rate=1; u.pitch=.95;
            const v=synthesis.getVoices();
            const voice=v.find(x=>x.name.includes('Daniel')||x.name.includes('Samantha'))||v.find(x=>x.lang.startsWith('en'))||v[0];
            if(voice)u.voice=voice;
            u.onend=()=>{i++;setTimeout(next,80)};
            u.onerror=()=>{isSpeaking=false;document.body.classList.remove('speaking')};
            synthesis.speak(u);
        }
        setTimeout(next,100);
    }

    // Stop on input focus
    input.addEventListener('focus',()=>{synthesis.cancel();isSpeaking=false;document.body.classList.remove('speaking')});

    // Init voices
    synthesis.getVoices();
    speechSynthesis.onvoiceschanged=()=>{};
    </script>
</body>
</html>
