<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ultron</title>
    <link rel="icon" type="image/png" href="/favicon.png">
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{background:#000;color:#fff;font-family:-apple-system,system-ui,sans-serif;height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;-webkit-font-smoothing:antialiased}

        /* Ambient */
        #ambient{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 50%,rgba(30,0,0,.4) 0%,transparent 70%);transition:background 1s}
        body.listening #ambient{background:radial-gradient(ellipse at 50% 50%,rgba(60,10,10,.5) 0%,transparent 70%)}
        body.speaking #ambient{background:radial-gradient(ellipse at 50% 50%,rgba(10,40,40,.4) 0%,transparent 70%)}

        /* Orb */
        #orb{width:140px;height:140px;border-radius:50%;background:radial-gradient(circle at 38% 38%,#ff3333 0%,#990000 40%,#330000 75%,#0a0a0a 100%);box-shadow:0 0 50px rgba(230,57,70,.4);transition:all .6s cubic-bezier(.4,0,.2,1);animation:breathe 5s ease-in-out infinite;cursor:pointer;-webkit-tap-highlight-color:transparent}
        @keyframes breathe{0%,100%{transform:scale(1);opacity:.85}50%{transform:scale(1.03);opacity:1}}

        body.listening #orb{animation:listen 1.2s ease-in-out infinite;box-shadow:0 0 80px rgba(230,57,70,.6)}
        @keyframes listen{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}

        body.hearing #orb{animation:hear .4s ease-in-out infinite alternate;box-shadow:0 0 90px rgba(230,57,70,.6)}
        @keyframes hear{0%{transform:scale(1.02)}100%{transform:scale(1.12)}}

        body.thinking #orb{background:radial-gradient(circle at 38% 38%,#a855f7 0%,#6b21a8 40%,#2d0066 75%,#0a0a0a 100%);box-shadow:0 0 50px rgba(168,85,247,.4);animation:think 2s ease-in-out infinite}
        @keyframes think{0%,100%{transform:scale(1) rotate(0deg)}50%{transform:scale(1.03) rotate(2deg)}}

        body.speaking #orb{background:radial-gradient(circle at 38% 38%,#4ecdc4 0%,#0e7c73 40%,#033 75%,#0a0a0a 100%);box-shadow:0 0 50px rgba(78,205,196,.4);animation:speak .7s ease-in-out infinite alternate}
        @keyframes speak{0%{transform:scale(1)}100%{transform:scale(1.05)}}

        /* Status */
        #status{margin-top:32px;text-align:center}
        #status-text{font-size:12px;font-weight:500;letter-spacing:2px;text-transform:uppercase;color:#555;transition:color .3s}
        body.listening #status-text{color:#e63946}
        body.hearing #status-text{color:#ff6b6b}
        body.thinking #status-text{color:#a855f7}
        body.speaking #status-text{color:#4ecdc4}
        #transcript{margin-top:10px;font-size:15px;max-width:400px;text-align:center;line-height:1.5;min-height:24px;color:#ccc}

        /* Conversation */
        #conv{position:fixed;bottom:50px;left:50%;transform:translateX(-50%);width:min(500px,90vw);max-height:160px;overflow-y:auto;scrollbar-width:none;mask-image:linear-gradient(transparent,black 30%,black)}
        #conv::-webkit-scrollbar{display:none}
        .msg{padding:6px 12px;margin:3px 0;font-size:12px;border-radius:8px;animation:fadeUp .3s ease;max-width:85%}
        .msg.user{color:#888;margin-left:auto;text-align:right}
        .msg.ai{color:#ddd;background:rgba(255,255,255,.03)}
        @keyframes fadeUp{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}

        /* Controls */
        #ctrls{position:fixed;bottom:12px;display:flex;gap:10px}
        .c{background:rgba(255,255,255,.05);border:1px solid #222;color:#666;padding:7px 12px;font-size:11px;border-radius:6px;cursor:pointer;font-family:inherit}
        .c:hover{border-color:#444;color:#aaa}
    </style>
</head>
<body>
    <div id="ambient"></div>
    <div id="orb" onclick="handleTap()"></div>
    <div id="status">
        <div id="status-text">TAP TO START</div>
        <div id="transcript"></div>
    </div>
    <div id="conv"></div>
    <div id="ctrls">
        <button class="c" onclick="stopAll()">Stop</button>
        <button class="c" onclick="toggleMute()">Mute</button>
        <label class="c" style="cursor:pointer">Upload<input type="file" style="display:none" onchange="uploadFile(this.files[0])" accept="*/*"></label>
    </div>

    <script>
    const synthesis = window.speechSynthesis;
    let recognition, state='idle', accum='', silenceTimer, isSpeaking=false;

    function handleTap(){
        if(state==='speaking'){stopAll();return}
        if(state==='idle'||state==='listening') startAlwaysListen();
    }

    function startAlwaysListen(){
        const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
        if(!SR){setState('idle');document.getElementById('status-text').textContent='VOICE NOT SUPPORTED';return}
        if(!recognition){
            recognition=new SR();
            recognition.continuous=true;
            recognition.interimResults=true;
            recognition.lang='en-US';
            recognition.onresult=onResult;
            recognition.onend=()=>{if(state!=='thinking'&&state!=='speaking')try{recognition.start()}catch(e){}};
            recognition.onerror=e=>{if(e.error!=='aborted'&&e.error!=='not-allowed')setTimeout(()=>{try{recognition.start()}catch(e){}},300)};
        }
        try{recognition.start()}catch(e){}
        setState('listening');
    }

    function onResult(e){
        let interim='',final='';
        for(let i=e.resultIndex;i<e.results.length;i++){
            if(e.results[i].isFinal) final+=e.results[i][0].transcript;
            else interim+=e.results[i][0].transcript;
        }
        if(interim||final){
            setState('hearing');
            document.getElementById('transcript').textContent=interim||final;
            if(isSpeaking){synthesis.cancel();isSpeaking=false}
            if(silenceTimer)clearTimeout(silenceTimer);
        }
        if(final){
            accum+=' '+final;
            document.getElementById('transcript').textContent=accum.trim();
            silenceTimer=setTimeout(()=>{
                const text=accum.trim();accum='';
                if(text.split(/\s+/).length>=2) processInput(text);
                else{document.getElementById('transcript').textContent='';setState('listening')}
            },1800);
        }
    }

    function processInput(text){
        document.getElementById('transcript').textContent='';
        addMsg('user',text);
        setState('thinking');

        fetch('/decide',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({query:text,priority:'normal'})})
        .then(r=>r.json())
        .then(d=>{
            const reply=d.reasoning||d.response||'';
            if(reply){addMsg('ai',reply);speak(reply)}
            else setState('listening');
        })
        .catch(()=>{setState('listening')});
    }

    function speak(text){
        let clean=text.replace(/```[\s\S]*?```/g,'').replace(/`([^`]+)`/g,'$1').replace(/\*\*?([^*]+)\*\*?/g,'$1').trim();
        if(!clean){setState('listening');return}
        isSpeaking=true;setState('speaking');
        const parts=clean.match(/[^.!?]+[.!?]+/g)||[clean];
        let i=0;
        function next(){
            if(i>=parts.length||!isSpeaking){isSpeaking=false;setState('listening');return}
            const u=new SpeechSynthesisUtterance(parts[i].trim());
            u.rate=1;u.pitch=.95;
            const v=synthesis.getVoices();
            const voice=v.find(x=>x.name.includes('Daniel')||x.name.includes('Samantha'))||v.find(x=>x.lang.startsWith('en')&&x.localService)||v[0];
            if(voice)u.voice=voice;
            u.onend=()=>{i++;setTimeout(next,80)};
            u.onerror=()=>{isSpeaking=false;setState('listening')};
            synthesis.speak(u);
        }
        setTimeout(next,120);
    }

    function stopAll(){
        synthesis.cancel();isSpeaking=false;accum='';
        document.getElementById('transcript').textContent='';
        setState('listening');
    }

    let muted=false;
    function toggleMute(){
        muted=!muted;
        if(muted){try{recognition.stop()}catch(e){}setState('idle');document.getElementById('status-text').textContent='MUTED'}
        else{startAlwaysListen()}
    }

    function uploadFile(file){
        if(!file)return;
        addMsg('user','📎 '+file.name);
        setState('thinking');
        const fd=new FormData();fd.append('file',file);
        fetch('/upload',{method:'POST',body:fd}).then(r=>r.json()).then(d=>{
            const reply=d.response||d.analysis||'File received.';
            addMsg('ai',reply);speak(reply);
        }).catch(()=>{addMsg('ai','Upload failed.');setState('listening')});
    }

    function setState(s){
        state=s;document.body.className=s==='idle'?'':s;
        const labels={idle:'TAP TO START',listening:'LISTENING',hearing:'',thinking:'THINKING',speaking:'SPEAKING'};
        document.getElementById('status-text').textContent=labels[s]||'';
    }

    function addMsg(who,text){
        const c=document.getElementById('conv'),el=document.createElement('div');
        el.className='msg '+who;el.textContent=text;c.appendChild(el);c.scrollTop=c.scrollHeight;
        while(c.children.length>20)c.removeChild(c.firstChild);
    }

    synthesis.getVoices();speechSynthesis.onvoiceschanged=()=>{};
    </script>
</body>
</html>
