# Redis — Procedural Memory Cache
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ultron-redis
  namespace: ultron
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ultron
      component: redis
  template:
    metadata:
      labels:
        app: ultron
        component: redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - containerPort: 6379
          command: ["redis-server", "--appendonly", "yes", "--maxmemory", "1gb"]
          resources:
            requests:
              memory: "256Mi"
            limits:
              memory: "1Gi"
          volumeMounts:
            - name: redis-data
              mountPath: /data
      volumes:
        - name: redis-data
          persistentVolumeClaim:
            claimName: ultron-redis-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: ultron-redis
  namespace: ultron
spec:
  selector:
    app: ultron
    component: redis
  ports:
    - port: 6379
      targetPort: 6379
---
# Neo4j — Episodic Memory Graph
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ultron-neo4j
  namespace: ultron
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ultron
      component: neo4j
  template:
    metadata:
      labels:
        app: ultron
        component: neo4j
    spec:
      containers:
        - name: neo4j
          image: neo4j:5-community
          ports:
            - containerPort: 7687
              name: bolt
            - containerPort: 7474
              name: http
          env:
            - name: NEO4J_AUTH
              valueFrom:
                secretKeyRef:
                  name: ultron-secrets
                  key: neo4j-auth
          resources:
            requests:
              memory: "1Gi"
            limits:
              memory: "4Gi"
          volumeMounts:
            - name: neo4j-data
              mountPath: /data
      volumes:
        - name: neo4j-data
          persistentVolumeClaim:
            claimName: ultron-neo4j-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: ultron-neo4j
  namespace: ultron
spec:
  selector:
    app: ultron
    component: neo4j
  ports:
    - name: bolt
      port: 7687
      targetPort: 7687
    - name: http
      port: 7474
      targetPort: 7474
---
# Qdrant — Semantic Memory Vector Search
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ultron-qdrant
  namespace: ultron
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ultron
      component: qdrant
  template:
    metadata:
      labels:
        app: ultron
        component: qdrant
    spec:
      containers:
        - name: qdrant
          image: qdrant/qdrant:latest
          ports:
            - containerPort: 6333
              name: rest
            - containerPort: 6334
              name: grpc
          resources:
            requests:
              memory: "512Mi"
            limits:
              memory: "2Gi"
          volumeMounts:
            - name: qdrant-data
              mountPath: /qdrant/storage
      volumes:
        - name: qdrant-data
          persistentVolumeClaim:
            claimName: ultron-qdrant-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: ultron-qdrant
  namespace: ultron
spec:
  selector:
    app: ultron
    component: qdrant
  ports:
    - name: rest
      port: 6333
      targetPort: 6333
    - name: grpc
      port: 6334
      targetPort: 6334
---
# MQTT Broker
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ultron-mqtt
  namespace: ultron
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ultron
      component: mqtt
  template:
    metadata:
      labels:
        app: ultron
        component: mqtt
    spec:
      containers:
        - name: mosquitto
          image: eclipse-mosquitto:2
          ports:
            - containerPort: 1883
            - containerPort: 9001
          volumeMounts:
            - name: mqtt-config
              mountPath: /mosquitto/config
      volumes:
        - name: mqtt-config
          configMap:
            name: ultron-mqtt-config
---
apiVersion: v1
kind: Service
metadata:
  name: ultron-mqtt
  namespace: ultron
spec:
  selector:
    app: ultron
    component: mqtt
  ports:
    - name: mqtt
      port: 1883
      targetPort: 1883
    - name: ws
      port: 9001
      targetPort: 9001
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ultron-mqtt-config
  namespace: ultron
data:
  mosquitto.conf: |
    listener 1883
    allow_anonymous true
    persistence true
    persistence_location /mosquitto/data/
    listener 9001
    protocol websockets
