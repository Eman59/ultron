# Secrets — PRODUCTION setup.
# DO NOT put real credentials here.
#
# Recommended approaches (in order of preference):
#
# 1. IRSA (IAM Role for Service Account) — BEST for EKS
#    Annotate the service account with the IAM role ARN:
#      kubectl annotate serviceaccount ultron-sa \
#        eks.amazonaws.com/role-arn=arn:aws:iam::<ACCOUNT>:role/UltronRole
#    Then boto3 picks up credentials automatically via the pod's projected token.
#    No secrets needed at all.
#
# 2. AWS Secrets Manager + external-secrets-operator
#    Store real values in AWS Secrets Manager, operator syncs them as k8s secrets.
#
# 3. Sealed Secrets (last resort)
#    Encrypt values with kubeseal before committing.
#
# For local dev: the Python containers mount ~/.aws from the host (see docker-compose.yml).
# On EKS: use IRSA — zero credential management.
apiVersion: v1
kind: Secret
metadata:
  name: ultron-secrets
  namespace: ultron
type: Opaque
stringData:
  # Database
  neo4j-auth: "neo4j/REPLACE_WITH_NEO4J_PASSWORD"

  # MQTT
  mqtt-password: ""

  # Ultron self-modification signing secret
  ultron-signing-secret: "REPLACE_WITH_SIGNING_SECRET"
  # NOTE: AWS credentials are NOT stored here.
  # On EKS, attach the IAM role via IRSA (see comments above).
  # Bedrock, Polly, Transcribe all resolve credentials automatically
  # from the pod's IRSA token — no keys in any YAML file.
