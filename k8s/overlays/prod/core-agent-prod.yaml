apiVersion: apps/v1
kind: Deployment
metadata:
  name: ultron-core-agent
  namespace: ultron
spec:
  replicas: 5
  template:
    spec:
      containers:
        - name: core-agent
          resources:
            requests:
              cpu: "2000m"
              memory: "4Gi"
            limits:
              cpu: "4000m"
              memory: "8Gi"
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              component: core-agent
