[package]
name = "ultron-real-time-data"
version = "0.1.0"
edition = "2021"
description = "Real-time data ingestion and processing pipeline for Ultron AI"
authors = ["Ultron AI Research Team"]

[dependencies]
tokio = { version = "1.35", features = ["full"] }
tokio-stream = "0.1"
futures = "0.3"
async-trait = "0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.6", features = ["v4"] }
dashmap = "5.5"
crossbeam-channel = "0.5"
rayon = "1.8"
tracing = "0.1"
tracing-subscriber = "0.3"
thiserror = "1.0"
bytes = "1.5"
