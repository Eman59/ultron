[package]
name = "dynamic_neural"
version = "0.1.0"
edition = "2021"
description = "Dynamic neural architecture with real-time plasticity"

[dependencies]
tokio = { version = "1.35", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"
rand = "0.8"
rand_chacha = "0.3"
rayon = "1.7"
ndarray = "0.15"
uuid = { version = "1.6", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
dashmap = "5.5"

[dev-dependencies]
criterion = "0.5"

[features]
default = []
