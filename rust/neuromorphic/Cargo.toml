[package]
name = "ultron-neuromorphic"
version = "0.1.0"
edition = "2021"
description = "Neuromorphic (spike-based) computing simulator for Ultron AI"
authors = ["Ultron AI Research Team"]

[dependencies]
rayon = "1.8"
serde = { version = "1.0", features = ["derive"] }
rand = "0.8"
tracing = "0.1"

[dependencies.tokio]
version = "1.35"
features = ["full"]

[dependencies.serde_json]
version = "1.0"

[[bin]]
name = "ultron-neuromorphic"
path = "src/main.rs"
