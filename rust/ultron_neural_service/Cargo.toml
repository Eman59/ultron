[package]
name = "ultron-neural-service"
version = "0.1.0"
edition = "2021"
description = "Ultron Dynamic Neural Architecture HTTP Service"

[dependencies]
tokio = { version = "1.35", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rand = "0.8"
uuid = { version = "1.6", features = ["v4"] }

[[bin]]
name = "ultron-neural-service"
path = "src/main.rs"
