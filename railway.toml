[build]
builder = "nixpacks"

[build.nixpacks]
providers = ["python", "rust"]
aptPkgs = ["curl", "ffmpeg", "sox", "pkg-config", "libssl-dev", "build-essential"]

[build.nixpacks.cmds]
install = "pip install fastapi uvicorn grpcio grpcio-tools protobuf numpy PyPDF2 python-multipart optuna paho-mqtt scikit-learn sentence-transformers chromadb requests"
build = """
set -e
chmod +x start_railway.sh
echo '[BUILD] Compiling Rust workspace...'
cd rust
cargo build --release --workspace --jobs 2 2>&1 | tail -30
echo '[BUILD] Rust binaries:'
ls -lh target/release/ultron-neural-service target/release/ultron-security-daemon target/release/ultron-real-time-data target/release/ultron-neuromorphic 2>/dev/null || echo '[WARN] Some Rust binaries missing'
cd ..
echo '[BUILD] Rust build complete'
"""

[deploy]
startCommand = "./start_railway.sh"
healthcheckPath = "/health"
healthcheckTimeout = 120
restartPolicyType = "always"

[variables]
PYTHONPATH = "/app"
ULTRON_PROJECT_ROOT = "/app"
ULTRON_NEURAL_HTTP_PORT = "50053"
ULTRON_DATA_PORT = "50054"
ULTRON_SECURITY_PORT = "50055"
ULTRON_NEURO_PORT = "50056"
RUST_LOG = "info"
CARGO_INCREMENTAL = "0"
CARGO_PROFILE_RELEASE_LTO = "thin"
