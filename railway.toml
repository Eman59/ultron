[build]
builder = "nixpacks"

[build.nixpacks]
providers = ["python"]
aptPkgs = ["curl", "ffmpeg", "sox"]

[build.nixpacks.cmds]
install = "pip install fastapi uvicorn grpcio grpcio-tools protobuf numpy PyPDF2 python-multipart optuna paho-mqtt scikit-learn"
build = "chmod +x start_railway.sh"

[deploy]
startCommand = "./start_railway.sh"
healthcheckPath = "/health"
healthcheckTimeout = 60
restartPolicyType = "always"

[variables]
PYTHONPATH = "/app"
ULTRON_PROJECT_ROOT = "/app"
